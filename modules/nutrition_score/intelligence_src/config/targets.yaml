# Nutrition TARGET tables only.
#
# These values describe what a user might aim for.
# They are NEVER measured intake and MUST NOT be converted into
# fabricated protein/carbohydrate/fat/fibre intake estimate ranges.
#
# Activity may modify endurance carbohydrate targets and water uplift;
# activity must NOT inflate General Nutrition Quality / Nutrition Score.
#
# Macro % + fibre_g Healthy bands come from the product macronutrient
# classification specification (Healthy category only).
# Water litre bands are configuration (Excel has no water column).

meta:
  note: >
    Target keys are referenced from goals.yaml via base_target_keys.
    Units and ranges are configuration — update here without changing scorers.
  score_separation: >
    Target generation must never feed back into Nutrition Score.

target_definitions:
  protein_g_per_kg_weight_loss:
    kind: protein_g_per_kg
    range:
      low: 1.6
      high: 2.2
      unit: g_per_kg_day
    notes:
      - "TARGET only. Not measured protein intake."

  protein_g_per_kg_muscle_gain:
    kind: protein_g_per_kg
    range:
      low: 1.6
      high: 2.2
      unit: g_per_kg_day
    notes:
      - "TARGET only. Not measured protein intake."

  protein_g_per_kg_strength:
    kind: protein_g_per_kg
    range:
      low: 1.6
      high: 2.0
      unit: g_per_kg_day
    notes:
      - "TARGET only. Overlaps muscle_gain; combination engine preserves overlap."

  protein_g_per_kg_endurance:
    kind: protein_g_per_kg
    range:
      low: 1.2
      high: 1.8
      unit: g_per_kg_day
    notes:
      - "TARGET only. Supports recovery; not measured intake."

  protein_g_per_kg_general:
    kind: protein_g_per_kg
    range:
      low: 1.2
      high: 1.6
      unit: g_per_kg_day
    notes:
      - "Baseline target for goals without a specialised protein prescription."

  carbohydrate_quality_focused:
    kind: carbohydrate_g_per_kg
    range:
      low: null
      high: null
      unit: g_per_kg_day
      mode: quality_focused
    notes:
      - "No fixed g/kg prescription. Emphasise carbohydrate quality via behaviour indicators."

  carbohydrate_adequate:
    kind: carbohydrate_g_per_kg
    range:
      low: 3.0
      high: 5.0
      unit: g_per_kg_day
      mode: adequate
    notes:
      - "TARGET only. Not measured carbohydrate intake."

  carbohydrate_endurance_activity_dependent:
    kind: carbohydrate_g_per_kg
    range:
      low: 6.0
      high: 10.0
      unit: g_per_kg_day
      mode: activity_dependent
    activity_bands:
      # activity_load_index is derived from exercise fields; bands modify TARGETS only.
      low:
        low: 3.0
        high: 5.0
        unit: g_per_kg_day
      moderate:
        low: 5.0
        high: 7.0
        unit: g_per_kg_day
      high:
        low: 6.0
        high: 10.0
        unit: g_per_kg_day
    notes:
      - "Approx 6–10 g/kg/day for relevant moderate/high endurance training ranges."
      - "Higher values only for appropriate training loads."
      - "Activity must not inflate Nutrition Score."

  fibre_priority_high:
    kind: fibre_priority
    priority: high
    notes:
      - "Priority flag for Target Generator / counselling — not measured fibre grams."

  fibre_priority_moderate:
    kind: fibre_priority
    priority: moderate
    notes:
      - "Priority flag only — not measured fibre grams."

  hydration_standard:
    kind: hydration_priority
    priority: standard
    notes:
      - "Hydration TARGET priority. Questionnaire water glasses are not measured litres."

  hydration_endurance:
    kind: hydration_priority
    priority: elevated
    notes:
      - "Elevated hydration TARGET priority for endurance. Not measured litres."

  energy_concept_deficit:
    kind: energy_concept
    concept: deficit
    notes:
      - "TARGET concept only. Questionnaire does not measure energy balance."

  energy_concept_adequate:
    kind: energy_concept
    concept: adequate
    notes:
      - "TARGET concept only. Not measured calorie surplus/adequacy."

  energy_concept_none:
    kind: energy_concept
    concept: none
    notes:
      - "No energy prescription for this goal profile."

# Healthy-category macronutrient TARGETS from the product classification sheet.
# Used by the Target Generator only — never by Nutrition Score.
goal_macro_targets:
  weight_loss:
    carbohydrate_percent: {low: 40, high: 45, unit: percent_energy}
    fat_percent: {low: 25, high: 30, unit: percent_energy}
    protein_percent: {low: 25, high: 30, unit: percent_energy}
    fibre_g: {low: 30, high: 40, unit: g_day}
  muscle_gain:
    carbohydrate_percent: {low: 45, high: 55, unit: percent_energy}
    fat_percent: {low: 20, high: 30, unit: percent_energy}
    protein_percent: {low: 25, high: 30, unit: percent_energy}
    fibre_g: {low: 25, high: 35, unit: g_day}
  energy_levels:
    carbohydrate_percent: {low: 45, high: 55, unit: percent_energy}
    fat_percent: {low: 25, high: 30, unit: percent_energy}
    protein_percent: {low: 20, high: 28, unit: percent_energy}
    fibre_g: {low: 30, high: 40, unit: g_day}
  metabolic_health:
    carbohydrate_percent: {low: 40, high: 50, unit: percent_energy}
    fat_percent: {low: 25, high: 35, unit: percent_energy}
    protein_percent: {low: 20, high: 25, unit: percent_energy}
    fibre_g: {low: 30, high: 45, unit: g_day}
  endurance:
    carbohydrate_percent: {low: 50, high: 60, unit: percent_energy}
    fat_percent: {low: 20, high: 30, unit: percent_energy}
    protein_percent: {low: 20, high: 25, unit: percent_energy}
    fibre_g: {low: 25, high: 35, unit: g_day}
  strength:
    carbohydrate_percent: {low: 45, high: 55, unit: percent_energy}
    fat_percent: {low: 20, high: 30, unit: percent_energy}
    protein_percent: {low: 25, high: 30, unit: percent_energy}
    fibre_g: {low: 25, high: 35, unit: g_day}

# Zero-goal / general baseline macro TARGETS (not a fabricated second goal).
general_macro_targets:
  carbohydrate_percent: {low: 45, high: 55, unit: percent_energy}
  fat_percent: {low: 20, high: 30, unit: percent_energy}
  protein_percent: {low: 15, high: 25, unit: percent_energy}
  fibre_g: {low: 25, high: 35, unit: g_day}

# Water litre TARGETS by hydration_priority (from target_definitions).
# Gender and activity may adjust TARGETS only.
water_targets:
  standard:
    default: {low: 2.0, high: 2.5, unit: L_day}
    female: {low: 2.0, high: 2.5, unit: L_day}
    male: {low: 2.5, high: 3.0, unit: L_day}
  elevated:
    default: {low: 3.0, high: 3.5, unit: L_day}
    female: {low: 2.5, high: 3.5, unit: L_day}
    male: {low: 3.0, high: 4.0, unit: L_day}

# Added to both ends of the water TARGET range after gender selection.
# Does not affect Nutrition Score.
activity_water_uplift_l:
  low: 0.0
  moderate: 0.25
  high: 0.5

# How to merge Healthy macro % / fibre_g when two goals are selected.
macro_combination:
  carbohydrate_percent: overlap_or_widen
  fat_percent: overlap_or_widen
  protein_percent: overlap_or_widen
  fibre_g: prefer_higher

# Zero-goal baseline keys when CombinedNutritionProfile has no goals.
zero_goal_target_keys:
  - protein_g_per_kg_general
  - carbohydrate_quality_focused
  - fibre_priority_moderate
  - hydration_standard
  - energy_concept_none

# ---------------------------------------------------------------------------
# Body metric targets
# ---------------------------------------------------------------------------

# NEEDS_APPROVAL: Product BMR reference ranges.
# These are configured reference values, not universally
# established medical "ideal" values.
# BMR reference range is age+gender only — NOT goal-dependent.
body_metric_targets:
  bmr:
    reference_ranges:
      age_18_29:
        male:   {low: 1800, high: 2400, unit: "kcal/day"}
        female: {low: 1400, high: 2000, unit: "kcal/day"}
      age_30_59:
        male:   {low: 1600, high: 2200, unit: "kcal/day"}
        female: {low: 1200, high: 1800, unit: "kcal/day"}
      age_60_plus:
        male:   {low: 1400, high: 2000, unit: "kcal/day"}
        female: {low: 1200, high: 1600, unit: "kcal/day"}

  # NEEDS_APPROVAL: Ideal waist circumference targets.
  # Goal-specific overrides can be added under goal_overrides.
  waist_cm:
    general:
      male:   {low: 80, high: 94, unit: cm}
      female: {low: 70, high: 80, unit: cm}
    goal_overrides: {}

  # NEEDS_APPROVAL: Ideal body fat percentage targets.
  # Goal-specific overrides can be added under goal_overrides.
  body_fat_percent:
    general:
      male:   {low: 10, high: 20, unit: percent}
      female: {low: 18, high: 28, unit: percent}
    goal_overrides: {}
