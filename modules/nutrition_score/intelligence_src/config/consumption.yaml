# Estimated CURRENT nutrition pattern (Phase 12 + macro distribution).
#
# These mappings estimate questionnaire-supported consumption PATTERNS.
# They are NEVER measured intake and MUST NOT feed Nutrition Score.
#
# Quantitative estimates are allowed for:
#   - water L/day (from water_intake_frequency glasses)
#   - fibre g/day as a WIDE RANGE
#   - C/P/F energy-share RANGES from population baseline + bounded deltas
#     (questionnaire-based estimate — not measured nutrient intake)

meta:
  note: >
    Current consumption is independent of goals, activity, weight, and height.
    Diet preference is interpretation context only — never a quantity bonus.

confidence_levels:
  - HIGH
  - MEDIUM
  - LOW
  - INSUFFICIENT

# ---------------------------------------------------------------------------
# Water
# ---------------------------------------------------------------------------
# Questionnaire: "How many glasses of water do you drink in a day?"
# Codes from metsights seed. Central glass volume is an engineering assumption.
water:
  glass_volume_ml: 250
  glass_volume_band_ml:
    low: 200
    high: 250
  unit: L_day
  note: "Beverage water from questionnaire glasses — not total body or dietary water."
  # option_value → L/day range using 200–250 mL/glass on the stated glass counts.
  frequency_mappings:
    "0": {low: 0.2, high: 0.5}   # less than 2 glasses
    "1": {low: 0.4, high: 0.5}   # 2 glasses
    "2": {low: 0.8, high: 1.0}   # 4 glasses
    "3": {low: 1.2, high: 1.5}   # 6 glasses
    "4": {low: 1.6, high: 2.0}   # 8 glasses
    "5": {low: 2.0, high: 2.6}   # more than 8 glasses
  # Caffeine field is mixed: codes 1–2 are cups/day; code 3 is weekly (not used).
  caffeine_fluid:
    enabled: true
    ml_per_cup: 165
    cups_per_day_by_code:
      "0": 0.0          # I do not drink coffee or tea
      "1": 1.5          # 1-2 cups per day
      "2": 2.5          # more than 2 cups per day
      # "3" = 2-3 times a week — not cups/day; omitted on purpose.

# ---------------------------------------------------------------------------
# Fibre
# ---------------------------------------------------------------------------
# Questionnaire-based RANGE, not measured grams.
#
# Fruit/vegetable frequency questions carry frequency information and are
# the strongest produce-fibre evidence.
#
# "Which food groups do you consume every day?" is presence, not quantity.
# Selected fibre-rich groups are supporting evidence with a serving RANGE —
# never interpreted as one measured serving/day.
#
# Staple cereals / mixed dishes are not quantified. Their midpoint provides a
# modest background contribution rather than an independent uncertainty band.
fibre:
  note: "Questionnaire-based fibre range — not measured grams."
  unit: g_day
  # Fruit and vegetables MUST come from dedicated frequency fields.
  # food_groups codes 3 (veg) and 4 (fruit) are excluded to prevent double-count.
  exclude_food_group_codes_from_groups:
    - "3"
    - "4"
  # Fibre from unnamed staple cereals / mixed dishes. The estimator uses the
  # midpoint only; this is an engineering population anchor, not measured intake.
  uncaptured_staple_fibre_g:
    low: 6
    high: 12
  # Apply one bounded uncertainty band after combining all central contributions.
  # Missing fields widen this band via the confidence level; component ranges
  # are never summed independently.
  uncertainty_fraction_by_confidence:
    HIGH: 0.20
    MEDIUM: 0.25
    LOW: 0.30
  plausible_range_g:
    low: 0
    high: 60
  per_serving_g:
    fruit: {low: 2, high: 4}
    vegetables: {low: 2, high: 4}
    cruciferous: {low: 2, high: 4}
    pulses: {low: 6, high: 8}
    whole_grains: {low: 3, high: 5}
    nuts_seeds: {low: 2, high: 3}
  # Serving RANGE per frequency code — not a point rate.
  frequency_to_servings_per_day:
    "0": {low: 1.0, high: 2.0}     # 1-2 times per day
    "2": {low: 0.25, high: 0.55}   # 2-3 times a week
    "3": {low: 0.08, high: 0.25}   # once a week or less
    "4": {low: 0.03, high: 0.15}   # 1-2 times per month
    "5": {low: 0.0, high: 0.10}    # rarely or never — not a point zero
  # Presence ≠ one measured daily serving.
  food_group_presence_servings_per_day:
    low: 0.3
    high: 0.7
  food_group_fibre_map:
    "0": whole_grains
    "1": pulses
    "5": nuts_seeds
    "9": cruciferous
  fruit_frequency_field: fresh_fruit_frequency
  vegetable_frequency_field: fresh_vegetable_frequency
  food_groups_field: food_groups
  # Internal only — not shown in user-facing output.
  tiers:
    low:
      max_exclusive: 15
      label: Low
    moderate:
      min_inclusive: 15
      max_inclusive: 25
      label: Moderate
    high:
      min_exclusive: 25
      label: High
  crossing_joiner: "–"

# ---------------------------------------------------------------------------
# Carbohydrate pattern (qualitative only)
# ---------------------------------------------------------------------------
carbohydrate:
  note: "Carbohydrate QUALITY pattern — not percentage or grams."
  quality_food_group_points:
    "0": 2   # whole grains
    "1": 1   # pulses
  quality_frequency_points:
    fresh_fruit_frequency:
      "0": 2
      "2": 1
      "3": 0
      "4": 0
      "5": 0
    fresh_vegetable_frequency:
      "0": 2
      "2": 1
      "3": 0
      "4": 0
      "5": 0
  refined_frequency_points:
    baked_goods_frequency:
      "1": 3
      "2": 2
      "3": 1
      "4": 0
      "5": 0
    dessert_frequency:
      "1": 3
      "2": 2
      "3": 1
      "4": 0
      "5": 0
  # First matching rule wins.
  rules:
    - id: insufficient_information
      max_available_fields: 0
    - id: refined_carb_frequent
      min_refined: 4
      max_quality: 2
    - id: whole_grain_oriented
      min_quality: 4
      max_refined: 1
    - id: mixed_carbohydrate_pattern
      min_quality: 2
    - id: limited_carbohydrate_quality_evidence
      fallback: true
  labels:
    insufficient_information: Insufficient information
    refined_carb_frequent: Refined-carb frequent
    whole_grain_oriented: Whole-grain oriented
    mixed_carbohydrate_pattern: Mixed carbohydrate pattern
    limited_carbohydrate_quality_evidence: Limited carbohydrate-quality evidence
  evidence_fields:
    - food_groups
    - fresh_fruit_frequency
    - fresh_vegetable_frequency
    - baked_goods_frequency
    - dessert_frequency

# ---------------------------------------------------------------------------
# Protein source variety (qualitative only)
# ---------------------------------------------------------------------------
protein:
  note: "Source variety / adequacy tier — not protein grams or percentage."
  source_food_groups:
    "1": pulses
    "2": dairy
    "5": nuts_seeds
    "6": eggs
    "7": chicken_fish
  diet_applicable_groups:
    "0": ["1", "2", "5"]           # Vegetarian
    "5": ["1", "2", "5"]           # Jain
    "2": ["1", "2", "5", "6"]      # Eggetarian
    "3": ["1", "2", "5", "6", "7"] # Pescatarian
    "4": ["1", "2", "5", "6", "7"] # Flexitarian
    "1": ["1", "2", "5", "6", "7"] # Non-vegetarian
  # If diet unknown, all configured source groups remain applicable.
  red_meat:
    field: red_meat_frequency
    counts_as_source_codes: ["1", "2", "3"]
    applicable_diets: ["1", "3", "4"]
    ignore_if_defaulted: true
  tiers:
    - id: limited_source_variety
      max_sources: 0
    - id: adequate_source_variety
      min_sources: 1
      max_sources: 2
    - id: rich_source_variety
      min_sources: 3
  labels:
    insufficient_information: Insufficient information
    limited_source_variety: Limited source variety
    adequate_source_variety: Adequate source variety
    rich_source_variety: Rich source variety

# ---------------------------------------------------------------------------
# Fat — added/saturated tendency (qualitative only)
# ---------------------------------------------------------------------------
fat:
  note: "Added/saturated-fat TENDENCY — not total fat grams or percentage. No cooking-oil data."
  ignore_red_meat_if_defaulted: true
  high_tendency_points:
    butter_dish_frequency:
      "1": 3
      "2": 2
      "3": 1
      "4": 0
      "5": 0
    baked_goods_frequency:
      "1": 2
      "2": 2
      "3": 1
      "4": 0
      "5": 0
    dessert_frequency:
      "1": 2
      "2": 1
      "3": 1
      "4": 0
      "5": 0
    red_meat_frequency:
      "1": 2
      "2": 1
      "3": 0
      "4": 0
      "5": 0
  evidence_fields:
    - butter_dish_frequency
    - baked_goods_frequency
    - dessert_frequency
    - red_meat_frequency
  rules:
    - id: insufficient_information
      max_available_fields: 0
    - id: higher_added_saturated_fat_tendency
      min_points: 5
    - id: moderate_added_saturated_fat_tendency
      min_points: 2
    - id: lower_added_saturated_fat_tendency
      fallback: true
  labels:
    insufficient_information: Insufficient information
    higher_added_saturated_fat_tendency: Higher added/saturated-fat tendency
    moderate_added_saturated_fat_tendency: Moderate added/saturated-fat tendency
    lower_added_saturated_fat_tendency: Lower added/saturated-fat tendency

# ---------------------------------------------------------------------------
# Confidence thresholds by count of available relevant fields
# ---------------------------------------------------------------------------
confidence:
  water:
    present: HIGH
    missing: INSUFFICIENT
  fibre:
    fields:
      - food_groups
      - fresh_fruit_frequency
      - fresh_vegetable_frequency
    by_available_count:
      "3": HIGH
      "2": MEDIUM
      "1": LOW
      "0": INSUFFICIENT
  carbohydrate:
    by_available_count:
      "5": HIGH
      "4": HIGH
      "3": MEDIUM
      "2": MEDIUM
      "1": LOW
      "0": INSUFFICIENT
  protein:
    food_groups_present: MEDIUM
    food_groups_missing: INSUFFICIENT
    food_groups_present_with_diet: HIGH
  fat:
    by_available_count:
      "4": HIGH
      "3": HIGH
      "2": MEDIUM
      "1": LOW
      "0": INSUFFICIENT

# ---------------------------------------------------------------------------
# Estimated C/P/F dietary distribution (questionnaire-based, not measured)
# ---------------------------------------------------------------------------
# Independent of goals, activity, anthropometry, and ideal targets.
# Methodology: population baseline + bounded directional adjustments +
# clamp + normalize + uncertainty range. Not signal-share normalization.
macro_distribution:
  note: >
    A questionnaire-based estimate of your dietary pattern — not a measurement.
    Estimated from the dietary patterns you reported, not from measured food
    amounts. Your actual intake may differ.
  withhold_message: "Not enough information to estimate your dietary distribution."
  display:
    range_rounding: 1
    label: "Questionnaire-based estimated dietary distribution"
    heading: "ESTIMATED DIETARY DISTRIBUTION"
    subheading: "From your questionnaire"
  baseline:
    carbohydrate: 55
    protein: 13
    fat: 32
  bounds:
    carbohydrate: [40, 65]
    protein: [10, 25]
    fat: [20, 40]
  max_delta:
    carbohydrate: 6
    protein: 5
    fat: 7
  withhold_below_fields: 3
  # Counted for confidence / withhold. Fruit, vegetables, and breakfast
  # describe quality, not quantity share — they do not move C/P/F deltas.
  contributing_fields:
    - diet_preference
    - food_groups
    - healthy_breakfast_frequency
    - fresh_fruit_frequency
    - fresh_vegetable_frequency
    - baked_goods_frequency
    - dessert_frequency
    - butter_dish_frequency
    - red_meat_frequency
  required_signals:
    carbohydrate:
      - dessert_frequency
      - baked_goods_frequency
    protein:
      - food_groups
    fat:
      - butter_dish_frequency
      - red_meat_frequency
      - food_groups
  confidence:
    high:
      min_fields: 8
      half_width: 3
    medium:
      min_fields: 5
      half_width: 5
    low:
      min_fields: 3
      half_width: 8
    min_half_width: 3
  # Questionnaire has no "daily" dessert/baked option. Code "1" is
  # "4 or more times a week". Dessert maps that highest bucket to `daily`
  # so the configured daily weight is reachable; baked/butter/red meat
  # map it to `gt_4_week` to match their configured keys.
  frequency_aliases:
    dessert_frequency:
      "1": daily
      "2": weekly_2_3
      "3": weekly_1
      "4": monthly
      "5": rare
    baked_goods_frequency:
      "1": gt_4_week
      "2": weekly_2_3
      "3": weekly_1
      "4": monthly
      "5": rare
    butter_dish_frequency:
      "1": gt_4_week
      "2": weekly_2_3
      "3": weekly_1
      "4": monthly
      "5": rare
    red_meat_frequency:
      "1": gt_4_week
      "2": weekly_2_3
      "3": weekly_1
      "4": monthly
      "5": rare
  signal_weights:
    carbohydrate:
      dessert:
        daily: 3
        gt_4_week: 2
        weekly_2_3: 1
      baked:
        gt_4_week: 2
        weekly_2_3: 1
    protein:
      variety:
        rich:
          min_sources: 4
          delta: 4
        adequate:
          min_sources: 2
          max_sources: 3
          delta: 2
        limited:
          max_sources: 1
          delta: 0
      # Vegetarians have fewer than 4 applicable sources. Filling the
      # applicable set still counts as rich so absence of meat is not a penalty.
      cap_rich_min_to_applicable_set: true
      red_meat:
        gt_4_week: 1
    fat:
      butter:
        gt_4_week: 3
        weekly_2_3: 1
      red_meat:
        gt_4_week: 2
        weekly_2_3: 1
      baked:
        gt_4_week: 1
      dessert:
        daily: 1
      nuts_present: 1
      dairy_present: 0.5
  food_group_codes:
    nuts: "5"
    dairy: "2"
